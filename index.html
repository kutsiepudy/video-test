<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Video Testing </title>
</head>

<body>
  <div class="display">
    <video id="screen" width="640" height="360">
      <source src="ep1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  <h1 id="epTitle"></h1>
  </div>

  <div class="buttons">
    <button id="prevEP">⏮</button>
    <button id="play-pause" aria-label="Play or pause">▶︎</button>
    <button id="nextEP">⏭</button>
    <button id="fullscreen">🗖</button>
    <input type="range" min="0" max="100" value="0" class="seek_slider" id="seek">
    <p id="timeDisplay">00:00 / 00:00</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
